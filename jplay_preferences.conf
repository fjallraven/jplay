# jplay2 application preferences.
#
# INI-style: [section] headers with key = value options. Read once at startup.
#
# Three files are read and merged option by option, weakest first, so each tier
# overrides only the options it actually names:
#   1. <exe dir>/jplay_preferences.conf        shipped default (this file)
#   2. ~/.jplay/jplay_preferences.conf         deployed user override
#   3. $JPLAY_PREFERENCES                      explicit override (wins)
#
# To change one setting, put just that section and key in your own file — there
# is no need to copy this one. Everything you leave out keeps the value below.
# For example, a ~/.jplay/jplay_preferences.conf of only
#
#   [control]
#   enabled = true
#
# turns the control channel on and leaves the port, timeline label and colour
# settings exactly as shipped. (The naming config, naming_convention.conf, is
# different: there the first existing file wins outright and is not merged.)
#
# Add further sections here as new preferences are introduced.

[shared_projects]
# Per-show project file, a template with a {project} placeholder. The extension
# picks the loader: .jpproj opens as a project, anything else is imported as an
# .otio. Either way the show comes in unsaved, so Save prompts for a location.



[timeline]
# Second row of a timeline clip's label (the first is always the source filename):
# a template whose {key} placeholders name naming-config picker keys — the
# [picker:*] sections of naming_convention.conf, e.g. department / asset / version.
# Read once at startup. A placeholder the clip's media carries no value for is
# dropped and the whitespace it leaves collapses, so "{department} {version}" reads
# "compositing" on media with no version; a template that resolves to nothing at
# all leaves the clip showing its filename alone, centred.
clip_metadata_label = {department}


[control]
# Whether the local control channel — the loopback listener the MCP server drives
# jplay through — is opened at all. Off by default so a fresh install binds no
# socket and Windows never raises its firewall prompt; the user turns it on with
# "MCP Control Channel" in the Settings panel. This is only the DEFAULT: once a
# user has saved settings of their own, ~/.jplay/settings.conf wins.
enabled = false

# Loopback TCP port for the control channel (src/ControlServer.h). Binding it is
# also jplay's single-instance lock, so every instance that should share the lock
# must agree on the value. Left unset or invalid, the compiled-in default (52154)
# is used. The port that actually got bound is published in ~/.jplay/control.json,
# which is what the client reads first.
port = 52154


[sync]
# Whether sync review (the SESSION panel) may touch the network: the LAN discovery
# beacon, hosting a session, and joining one. Off by default for the same reason
# as [control] above — no socket is opened until "Enable network" is ticked in the
# panel. Also only the DEFAULT; a saved ~/.jplay/settings.conf wins.
enabled = false


[color_management]
# The colour pipeline the app starts in:
#   srgb   built-in scene-linear -> sRGB conversion; OpenColorIO is not loaded
#   ocio   OpenColorIO display transform, config from $OCIO or the [ocio] rules
# Anything else — including a missing key or a missing section — reads as "srgb",
# so OCIO is strictly opt-in: no config is opened, and none of its startup cost is
# paid, until something asks for it. This is only the DEFAULT, for a fresh session
# and for File > New; a .jpproj saved in OCIO mode still opens in OCIO mode (its
# config is loaded at that point), as does the "Color Management" toggle in the
# Settings panel.
color_pipeline = srgb
