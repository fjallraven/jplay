# jplay2 naming configuration.
#
# Two independent, order-sensitive rule sets, plus discovery preferences. In
# each set the entries are tried top-to-bottom and the first full match wins, so
# list the most specific layouts first.
#
#   [dir:<name>]   dir_regex  — a directory layout below a shot root. Named
#                               groups (all optional): sequence, shot,
#                               department. CREATE FROM DIRECTORY matches it
#                               anchored (^...$) against a directory path
#                               RELATIVE to the chosen root; the metadata pickers
#                               match it against the tail of a media file's
#                               directory (any leading directories allowed).
#
#   [file:<name>]  file_regex — a filename convention, matched (^...$) against a
#                               media file's basename. Named groups (all
#                               optional): asset, version, take, frame, extension
#                               — and sequence/shot/department when the filename
#                               itself carries them (see [file:seq_shot_dept] and
#                               the dept_* rules). Only files with a known media
#                               extension are considered, so a plain catch-all is
#                               safe.
#                               `version` (v001) and `take` (tk01/take01) are the
#                               two spellings of "which iteration of this asset";
#                               a convention uses one or the other, so no filename
#                               captures both.
#                               The placeholder {departments} is expanded at load
#                               time into an alternation of [preferences]
#                               departments, which is what lets a rule peel a
#                               department off a basename without mistaking the
#                               second half of a two-token asset name for one.
#                               With no departments configured it becomes a
#                               never-matching group, disabling those rules.
#
#   [picker:<key>]            — declares one metadata-bar dropdown. `key` names a
#                               regex group (dir or file). `kind` = dir (options
#                               are sibling directories at that level), file
#                               (options are captured from sibling filenames), or
#                               auto (file where the filename captures the group,
#                               else dir — for a group that lives in the filename
#                               in one convention and the folder in another; file
#                               wins because the [dir:*] templates are catch-alls).
#                               `label` is the dropdown caption. Optional
#                               `sort = version` orders latest-first (numeric);
#                               default is natural-alphabetical. It also declares
#                               the group to hold a version-like numeric token, so
#                               it is excluded from a clip's identity and indexes
#                               the "latest" of an asset — which is how `take`
#                               behaves exactly as `version` does without any code
#                               knowing the name. Section order is the display
#                               order. Add/remove a picker here to change the bar
#                               — no code change needed.
#
#   [preferences]             — ranks departments/assets when CREATE FROM
#                               DIRECTORY must choose one clip per shot: the
#                               highest-ranked one present wins, otherwise
#                               natural-alphabetical order. Also names the
#                               picker a multi-clip pick stops at
#                               (multi_select_picker, below).
#
# Splitting directory shape from filename shape keeps the two independent: a new
# folder layout is one [dir:*] line and a new filename convention is one [file:*]
# line, and every combination of the two works without re-listing.


# ─────────────────── directory layouts ───────────────────

[dir:flat_seq_shot_dept]
# <sequence>__<shot>__<department>   one folder carrying all three (e.g. AWK__010__Compositing).
# Listed before the nested layouts: their tails slide up a path, so [dir:seq_shot_dept]
# would otherwise read ".../out/AWK__010__Compositing" as sequence=out,
# shot=AWK__010__Compositing. Both flat rules need a "__" inside a single component,
# so no nested tree can match them.
dir_regex = ^(?P<sequence>[^/_]+(?:_[^/_]+)*?)__(?P<shot>[^/]+?)__(?P<department>[^/_]+)$

[dir:flat_seq_shot]
# <sequence>__<shot>
dir_regex = ^(?P<sequence>[^/]+?)__(?P<shot>[^/]+)$

[dir:seq_shot_dept]
# <sequence>/<shot>/<department>
dir_regex = ^(?P<sequence>[^/]+)/(?P<shot>[^/]+)/(?P<department>[^/]+)$

[dir:seq_shot]
# <sequence>/<shot>
dir_regex = ^(?P<sequence>[^/]+)/(?P<shot>[^/]+)$

[dir:shot_dept]
# <shot>/<department>
dir_regex = ^(?P<shot>[^/]+)/(?P<department>[^/]+)$

[dir:shot]
# <shot>
dir_regex = ^(?P<shot>[^/]+)$


# ─────────────────── filename conventions ───────────────────

[file:dept_versioned_sequence]
# main_Compositing_v001_0001.exr  — the department lives in the basename next to
# the asset. {departments} is expanded at load time from [preferences] departments,
# so only a real department name is peeled off: bg_smoke_v001.0001.exr keeps its
# two-token asset instead of silently reading "smoke" as a department. The four
# dept_* rules come first because the version/take rules below would otherwise
# absorb the department into the asset; each needs two "_" before the tag, so a
# plain main_v001 cannot reach them.
file_regex = ^(?P<asset>.+?)_(?P<department>{departments})_(?P<version>v\d+)[._](?P<frame>\d+)\.(?P<extension>exr)$

[file:dept_take_sequence]
# main_Compositing_tk01_0001.exr
file_regex = ^(?P<asset>.+?)_(?P<department>{departments})_(?P<take>(?:tk|take)\d+)[._](?P<frame>\d+)\.(?P<extension>exr)$

[file:dept_versioned]
# main_Compositing_v001.mov
file_regex = ^(?P<asset>.+?)_(?P<department>{departments})_(?P<version>v\d+)\.(?P<extension>[^.]+)$

[file:dept_take]
# main_Compositing_tk01.mov
file_regex = ^(?P<asset>.+?)_(?P<department>{departments})_(?P<take>(?:tk|take)\d+)\.(?P<extension>[^.]+)$

[file:take]
# asset_tk01.ext / asset_take01.ext  — a take tag instead of a version tag. A
# convention uses one or the other, never both, so no path fills the Version and
# Take pickers at once. Listed before [file:seq_shot_dept], which would otherwise
# read main_tk01_0001.exr as sequence=main shot=tk01 department=0001.
file_regex = ^(?P<asset>.+?)_(?P<take>(?:tk|take)\d+)\.(?P<extension>[^.]+)$

[file:take_sequence]
# asset_tk01.0001.exr / asset_tk01_0001.exr
file_regex = ^(?P<asset>.+?)_(?P<take>(?:tk|take)\d+)[._](?P<frame>\d+)\.(?P<extension>exr)$

[file:versioned]
# asset_v001.ext
file_regex = ^(?P<asset>.+?)_(?P<version>v\d+)\.(?P<extension>[^.]+)$

[file:versioned_sequence]
# asset_v003.0001.exr / asset_v003_0001.exr  — versioned render output where the
# trailing digits are a frame number. Listed before exr_sequence so the version
# is captured separately instead of being absorbed into the asset.
file_regex = ^(?P<asset>.+?)_(?P<version>v\d+)[._](?P<frame>\d+)\.(?P<extension>exr)$

[file:seq_shot_dept]
# unh0400_0010_lighting.0994.exr / unh0400_0010_lighting.mp4  — sequence, shot and
# department all live in the basename: {sequence}_{shot}_{department}, with an
# optional trailing .<frame> before the extension. Deliberately NO `asset` group:
# here the sequence/shot/department triple IS the clip's identity, so there is no
# separate asset layer to expose or pick. An EXR run still collapses to one clip
# because the grouping identity (its non-version/frame groups) is frame-independent.
# Listed after the versioned rules so a real `_v###` file is not mistaken for a
# department, and before exr_sequence/plain so those don't absorb the prefix.
file_regex = ^(?P<sequence>[^_]+)_(?P<shot>[^_]+)_(?P<department>[^_.]+)(?:\.(?P<frame>\d+))?\.(?P<extension>[^.]+)$

[file:exr_sequence]
# asset_0001.exr / asset.0001.exr  — trailing digits are a frame number, not a
# version, so the whole run collapses to one asset. Either separator is allowed.
file_regex = ^(?P<asset>.+?)[._](?P<frame>\d+)\.(?P<extension>exr)$

[file:plain]
# asset.ext
file_regex = ^(?P<asset>.+?)\.(?P<extension>[^.]+)$


# ─────────────────── metadata-bar pickers ───────────────────

[picker:department]
# `auto`: read from the basename in the {seq}_{shot}_{dept} filename convention,
# or from the folder in the directory layouts. File wins when both could apply,
# since the [dir:*] templates match almost any folder and would mislabel it.
kind  = auto
label = Department

[picker:asset]
kind  = auto
label = Asset Layer

[picker:version]
kind  = auto
label = Version
sort  = version

[picker:take]
# Mutually exclusive with `version` — a convention spells its iteration one way or
# the other — so exactly one of the two ever has options for a given path, and the
# other is dropped from the bar.
kind  = file
label = Take
sort  = version


# ─────────────────── discovery preferences ───────────────────

[preferences]
# Ranks departments/assets for CREATE FROM DIRECTORY and orders the Department
# dropdown. The department list is also expanded into every {departments}
# placeholder in the file_regexes above, so it is the single source of truth for
# what counts as a department name.
departments = Compositing, Lighting, Animation, Layout
assets = main

# Where the clip picker menu stops when SEVERAL clips are selected. That picker
# commits for the whole selection and every picker after it is hidden - picking
# one version for a dozen different shots means nothing, so each clip resolves
# this value on its own and then takes the top option of the LAST picker (its
# newest version). A clip the value does not resolve for is left alone, logged.
# Unset, or naming a picker the selected path lacks, falls back to the last
# picker before the final one that does apply. One clip selected is unaffected:
# the full cascade shows and the last picker commits, as always.
multi_select_picker = department
